<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" role="img" aria-label="Mohammad Sadra Naderi, MS-X01. Security researcher and full-stack developer. Founder of ZVitoX.">
<defs>
