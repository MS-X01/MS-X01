<g clip-path="url(#cl3)"><text x="34" y="190" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="18" font-weight="400" xml:space="preserve"><tspan fill="#FF0000">$ </tspan><tspan fill="#EDEDED">cat role.txt</tspan></text></g>
<g clip-path="url(#cl4)"><text x="34" y="220" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="19" font-weight="400" xml:space="preserve"><tspan fill="#D8D8D8">security researcher</tspan><tspan fill="#FF0000">  /  </tspan><tspan fill="#D8D8D8">full-stack developer</tspan></text></g>
<g clip-path="url(#cl5)"><text x="34" y="248" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="19" font-weight="400" xml:space="preserve"><tspan fill="#D8D8D8">founder of </tspan><tspan fill="#FF0000">ZVitoX</tspan></text></g>
<g clip-path="url(#cl6)"><text x="34" y="292" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="18" font-weight="400" xml:space="preserve"><tspan fill="#FF0000">$ </tspan><tspan fill="#EDEDED">cat scope.txt</tspan></text></g>
<g clip-path="url(#cl7)"><text x="34" y="322" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="19" font-weight="400" xml:space="preserve"><tspan fill="#D8D8D8">authorized targets only</tspan><tspan fill="#FF0000" fill-opacity="0"> █<animate attributeName="fill-opacity" values="0;1;1;0;0" keyTimes="0;0.001;0.5;0.5001;1" dur="1.06s" begin="7.4s" repeatCount="indefinite"/></tspan></text></g>
