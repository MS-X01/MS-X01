<linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.045"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<clipPath id="frame"><rect width="900" height="350" rx="14"/></clipPath>
<clipPath id="cl1"><rect x="30" y="70" width="0" height="32"><animate attributeName="width" from="0" to="210" begin="0.5s" dur="0.5s" fill="freeze"/></rect></clipPath>
<clipPath id="cl2"><rect x="30" y="104" width="0" height="46"><animate attributeName="width" from="0" to="550" begin="1.2s" dur="0.9s" fill="freeze"/></rect></clipPath>
<clipPath id="cl3"><rect x="30" y="168" width="0" height="32"><animate attributeName="width" from="0" to="270" begin="2.4s" dur="0.8s" fill="freeze"/></rect></clipPath>
<clipPath id="cl4"><rect x="30" y="197" width="0" height="33"><animate attributeName="width" from="0" to="600" begin="3.4s" dur="1.0s" fill="freeze"/></rect></clipPath>
<clipPath id="cl5"><rect x="30" y="225" width="0" height="33"><animate attributeName="width" from="0" to="340" begin="4.5s" dur="0.6s" fill="freeze"/></rect></clipPath>
<clipPath id="cl6"><rect x="30" y="270" width="0" height="32"><animate attributeName="width" from="0" to="270" begin="5.5s" dur="0.8s" fill="freeze"/></rect></clipPath>
<clipPath id="cl7"><rect x="30" y="299" width="0" height="33"><animate attributeName="width" from="0" to="460" begin="6.5s" dur="0.8s" fill="freeze"/></rect></clipPath>
