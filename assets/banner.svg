<text x="874" y="262" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="94" font-weight="800" fill="none" stroke="#FF0000" stroke-opacity="0.32" stroke-width="1.4">MS-X01</text>
<text x="870" y="296" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="3" fill="#8A8A8E">BREAK IT. AUTOMATE IT. WRITE IT DOWN.</text>
